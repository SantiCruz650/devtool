<!-- punto cian = la request (el evento); las 2 rayas con opacidad
  decreciente = la estela/rastro que se apaga con el tiempo (opacidad =
  antiguedad del log); lectura secundaria = las ventanas que Estela
  colapsa en una. Glifo unico: header/landing + favicon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g stroke="#22d3ee" stroke-linecap="round" fill="none">
    <line x1="4" y1="21" x2="14" y2="21" stroke-width="4" opacity="0.45"/>
    <line x1="10" y1="12" x2="20" y2="12" stroke-width="4" opacity="0.85"/>
  </g>
  <circle cx="24" cy="12" r="6" fill="#22d3ee"/>
</svg>
